name: ci

on:
  push:
  pull_request:

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          set -e
          for f in $(git ls-files '*.sh'); do
            echo "check $f"
            bash -n "$f"
          done
